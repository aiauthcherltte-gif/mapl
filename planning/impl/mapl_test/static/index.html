<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>화면 자료 게시 · 시험판</title>
<link rel="stylesheet" href="/static/app.css">
<script src="/static/app.js" defer></script>
</head>
<body>
<div id="band" role="note">시험판 · 시험용 대상만 바뀜 · 실제 승인·실행과 연결 안 됨</div>
<main>
<section id="registration" hidden>
<h1>시험용 패스키 등록</h1>
<p>이 시험판 전용입니다. 서버를 켠 터미널에 표시된 등록 코드를 입력하세요.</p>
<label for="setup-code">등록 코드</label>
<input id="setup-code" autocomplete="off" spellcheck="false" maxlength="10">
<button id="register" type="button">시험용 패스키 등록</button>
<p id="registration-status" role="status"></p>
</section>
<section id="request" hidden>
<h1 id="title">화면 자료 게시</h1>
<dl>
<dt>무엇이 바뀌나</dt><dd id="change"></dd>
<dt>승인 기한</dt><dd id="deadline"></dd>
<dt>중요한 조건</dt><dd id="conditions"></dd>
<dt>현재 상태</dt><dd id="state" role="status" aria-live="polite"></dd>
</dl>
<div id="actions" hidden>
<button id="decline" type="button" class="secondary">거절</button>
<button id="approve" type="button">승인</button>
</div>
<section id="confirmation" hidden aria-label="승인 확인">
<p id="confirmation-text"></p>
<button id="cancel-confirm" type="button" class="secondary">취소</button>
<button id="confirm-approve" type="button">기기 확인으로 승인</button>
</section>
<details><summary>자세히</summary><pre id="details"></pre></details>
</section>
<p id="error" role="alert"></p>
</main>
</body>
</html>
